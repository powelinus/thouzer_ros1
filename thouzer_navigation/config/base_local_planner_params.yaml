TrajectoryPlannerROS:
  max_vel_x: 0.15
  min_vel_x: 0.05

  max_vel_theta: 0.2
  min_vel_theta: -0.2
  min_in_place_vel_theta: 0.3

  acc_lim_x: 0.5
  acc_lim_theta: 0.8

  sim_time: 1
  sim_granularity: 0.025

  vx_samples: 8
  vtheta_samples: 20

  pdist_scale: 0.8
  gdist_scale: 0.6
  occdist_scale: 0.02

  holonomic_robot: false
  dwa: true