mqtt:
  client:
    protocol: 4      # MQTTv311
    transport: websockets
  connection:
    host: 192.168.212.1
    # host: localhost
    # port: 1883
    port: 8080
    keepalive: 60
  account:
    username: "mqtt"
    password: "sI7G@DijuY"

serializer: json:dumps
deserializer: json:loads
bridge:
  - factory: mqtt_bridge.bridge:MqttToRosBridge
    msg_type: thouzer_msgs.msg:Battery
    topic_from: 0/WHISPERER/RMS-10E2-AAZ03/battery
    topic_to: /thouzer/battery
  - factory: mqtt_bridge.bridge:RosToMqttBridge
    msg_type: thouzer_msgs.msg:Commander
    topic_from: /thouzer/commander
    topic_to: 0/THOUZER_HW/RMS-10E2-AAZ03/exec/cmd
  - factory: mqtt_bridge.bridge:RosToMqttBridge
    msg_type: thouzer_msgs.msg:Vel
    topic_from: /thouzer/vel
    topic_to: 0/WHISPERER/RMS-10E2-AAZ03/nav
  - factory: mqtt_bridge.bridge:MqttToRosBridge
    msg_type: thouzer_msgs.msg:Odom
    topic_from: 0/WHISPERER/RMS-10E2-AAZ03/pos2D_DWO
    topic_to: /thouzer/odom
  - factory: mqtt_bridge.bridge:MqttToRosBridge
    msg_type: thouzer_msgs.msg:App
    topic_from: 0/THOUZER_HW/RMS-10E2-AAZ03/status/app
    topic_to: /thouzer/status/app
  - factory: mqtt_bridge.bridge:MqttToRosBridge
    msg_type: thouzer_msgs.msg:Vel
    topic_from: 0/WHISPERER/RMS-10E2-AAZ03/vel2D_DWO
    topic_to: /thouzer/formatted_vel

